<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140c1c">
<title>Melbourne Pixel Train</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23140c1c'/%3E%3Crect x='1' y='5' width='14' height='6' fill='%23f4f4ec'/%3E%3Crect x='1' y='6' width='11' height='2' fill='%231b1f3b'/%3E%3Crect x='12' y='5' width='3' height='3' fill='%232a5a9c'/%3E%3Crect x='12' y='8' width='3' height='3' fill='%23ffd65c'/%3E%3Crect x='3' y='11' width='2' height='2' fill='%236c6c7a'/%3E%3Crect x='10' y='11' width='2' height='2' fill='%236c6c7a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="screen" width="320" height="180" role="img" aria-label="A pixel-art train running from Flinders Street to Belgrave"></canvas>
<div id="bar" role="toolbar" aria-label="Train controls">
  <button id="b-mode" type="button" aria-label="Driver mode" title="Drive the train yourself (C)"><svg viewBox="0 0 16 16"><path d="M5 2h6v1h2v2h1v6h-1v2h-2v1H5v-1H3v-2H2V5h1V3h2zM6 4H5v1H4v6h1v1h6v-1h1V5h-1V4zM7 4h2v3H7zM7 7h2v2H7zM4 7h3v1H4zM9 7h3v1H9zM7 9h2v3H7z"/></svg><span>AUTO</span></button>
  <button id="b-engine" type="button" class="drv" hidden aria-label="Raise the pantograph" title="Pantograph up / down (E)"><svg viewBox="0 0 16 16"><path d="M2 2h12v1H2zM4 4h8v1H4zM10 5h1v1h-1zM9 6h1v1H9zM8 7h1v1H8zM7 8h1v1H7zM8 9h1v1H8zM9 10h1v1H9zM10 11h1v1h-1zM3 12h10v2H3z"/></svg><span>RAISE</span></button>
  <button id="b-power" type="button" class="drv" hidden aria-label="Power: notch up" title="Power up / release brake (Up arrow)"><svg viewBox="0 0 16 16"><path d="M7 3h2v1h1v1h1v1h1v1h1v1h1v2H2V8h1V7h1V6h1V5h1V4h1z"/></svg><span>POWER</span></button>
  <button id="b-brake" type="button" class="drv" hidden aria-label="Brake: notch down" title="Power down / brake (Down arrow, B = emergency)"><svg viewBox="0 0 16 16"><path d="M2 5h12v2h-1v1h-1v1h-1v1h-1v1H9v1H7v-1H6v-1H5V9H4V8H3V7H2z"/></svg><span>BRAKE</span></button>
  <button id="b-doors" type="button" class="drv" hidden aria-label="Open the doors" title="Doors (O)"><svg viewBox="0 0 16 16"><path d="M2 2h12v12H2zM4 4v10h3V4zM9 4v10h3V4z"/></svg><span>OPEN</span></button>
  <button id="b-horn" type="button" class="drv" hidden aria-label="Horn" title="Horn (hold H)"><svg viewBox="0 0 16 16"><path d="M1 7h3v2H1zM4 6h2v4H4zM6 5h2v6H6zM8 3h2v10H8zM12 4h1v1h-1zM13 7h2v2h-2zM12 11h1v1h-1z"/></svg><span>HORN</span></button>
  <button id="b-light" type="button" class="drv" hidden aria-label="Headlight" title="Headlight (L)"><svg viewBox="0 0 16 16"><path d="M6 2h4v1h1v1h1v4h-1v1h-1v2H6V9H5V8H4V4h1V3h1zM6 12h4v1H6zM7 14h2v1H7z"/></svg><span>LIGHT</span></button>
  <button id="b-pause" type="button" aria-label="Pause" title="Pause (P)"><svg viewBox="0 0 16 16"></svg><span>PAUSE</span></button>
  <button id="b-speed" type="button" class="big aut" aria-label="Speed 1x" title="Speed (1 / 2 / 4)">1x</button>
  <button id="b-skip" type="button" class="aut" aria-label="Skip to next station" title="Next station (N)"><svg viewBox="0 0 16 16"><path d="M3 3h2v1h2v1h2v1h1v1h1v2h-1v1h-1v1H7v1H5v1H3zM12 3h2v10h-2z"/></svg><span>NEXT</span></button>
  <button id="b-time" type="button" class="aut" aria-label="Time of day" title="Time of day (T)"><svg viewBox="0 0 16 16"></svg><span>AUTO</span></button>
  <button id="b-rain" type="button" class="aut" aria-label="Rain" title="Rain (W)"><svg viewBox="0 0 16 16"><path d="M5 2h5v1h2v1h1v2h1v3H1V6h1V4h1V3h2zM3 11h1v2H3zM7 11h1v2H7zM11 11h1v2h-1zM5 13h1v2H5zM9 13h1v2H9z"/></svg><span>AUTO</span></button>
  <button id="b-mute" type="button" aria-label="Sound" title="Sound (M)"><svg viewBox="0 0 16 16"></svg><span>TAP</span></button>
</div>
<script src="js/01-config.js"></script>
<script src="js/02-route.js"></script>
<script src="js/03-palette.js"></script>
<script src="js/04-drawing.js"></script>
<script src="js/05-train.js"></script>
<script src="js/06-world-tiles.js"></script>
<script src="js/07-terrain-engine.js"></script>
<script src="js/08-scenery-shared.js"></script>
<script src="js/09-scenery-city-yarra.js"></script>
<script src="js/10-scenery-suburbs.js"></script>
<script src="js/11-scenery-hills.js"></script>
<script src="js/12-scenery-table.js"></script>
<script src="js/13-entities.js"></script>
<script src="js/14-line-crossings.js"></script>
<script src="js/15-stations.js"></script>
<script src="js/16-people.js"></script>
<script src="js/17-journey.js"></script>
<script src="js/18-driver.js"></script>
<script src="js/19-atmosphere.js"></script>
<script src="js/20-ui.js"></script>
<script src="js/21-sound.js"></script>
<script src="js/22-map-controls.js"></script>
<script src="js/23-main.js"></script>
</body>
</html>
